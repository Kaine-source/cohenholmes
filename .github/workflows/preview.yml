name: Preview deploy

on:
  pull_request:
    branches: [main]

# one preview per PR: a newer push cancels an in-flight run so the
# comment/URL can't be overwritten by a slower older deploy
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # branches in this repo only — fork PRs don't get secrets, and we don't
    # want to hand a deploy credential to untrusted code
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          out="$(npx wrangler@4 pages deploy --branch="$HEAD_REF" 2>&1)"
          echo "$out"
          # prefer the stable branch-alias URL; fall back to the per-deploy URL
          url="$(printf '%s\n' "$out" | grep -oE 'alias URL: https://[a-z0-9-]+\.cohenholmes-site\.pages\.dev' | grep -oE 'https://\S+' | head -n1)"
          if [ -z "$url" ]; then
            url="$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9-]+\.cohenholmes-site\.pages\.dev' | head -n1)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" --edit-last --body "Preview: $URL" \
            || gh pr comment "$PR" --body "Preview: $URL"
