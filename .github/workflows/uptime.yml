name: Monitor site

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC); GitHub may batch under load
  workflow_dispatch:          # run on demand from the Actions tab

# only one monitor run at a time; a new run supersedes a queued one
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run checks
        id: run
        run: node scripts/monitor.mjs

      - name: Open or update the tracking issue
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create monitoring --color B60205 --description "Automated site monitoring" --force
          existing="$(gh issue list --label monitoring --state open --json number --jq '.[0].number // empty')"
          body="A site monitoring run failed. Details and the exact failing checks are in the run summary:
          $RUN_URL

          This issue will close itself automatically once a later run passes."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — $RUN_URL"
          else
            gh issue create --label monitoring --title "Site monitoring is failing" --body "$body"
          fi

      - name: Close the tracking issue on recovery
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label monitoring --state open --json number --jq '.[].number'); do
            gh issue comment "$n" --body "Recovered — checks passing again as of $RUN_URL"
            gh issue close "$n"
          done
