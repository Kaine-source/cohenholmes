<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Kaine Cohen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171C;
    --paper:#F3F1EC;
    --line:#D8D4C8;
    --muted:#6B6A63;
    --signal:#3B5BFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 28px; }

  .pagehead{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:8px 20px;
    padding-top:44px;
  }
  .pagehead .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    text-decoration:none;
  }
  .pagehead .brand:hover{ color:var(--signal); }
  .subnav{ display:flex; flex-wrap:wrap; gap:16px; }
  .subnav a{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
  }
  .subnav a:hover{ color:var(--signal); }

  main{
    min-height:52vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    max-width:46ch;
    padding:40px 0 80px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:480;
    font-size:clamp(2rem,6vw,3rem);
    line-height:1.1;
    letter-spacing:-0.02em;
    margin-bottom:14px;
  }
  h1 em{font-style:italic;font-weight:340;color:var(--signal);}
  p{color:var(--muted);font-size:1rem;margin-bottom:24px;}
  a.home{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 18px;
    border:1px solid var(--line);
    border-radius:100px;
    color:var(--ink);
    text-decoration:none;
    font-size:0.95rem;
    font-weight:500;
    transition:border-color 0.2s ease,background 0.2s ease;
  }
  a.home:hover{border-color:var(--signal);background:#EDEEFB;}

  footer{
    padding:32px 0 48px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pagehead">
      <a class="brand" href="/">Kaine Cohen</a>
      <nav class="subnav" aria-label="Sections">
        <a href="/">Home</a>
        <a href="/ca-builder">CA Builder</a>
        <a href="/ai-governance-check">AI Check</a>
        <a href="/mail-auth">Mail Auth</a>
        <a href="/writing">Writing</a>
      </nav>
    </div>

    <main>
      <h1>That page <em>isn't here</em>.</h1>
      <p>The link may be old, or the address slightly off. Nothing's broken — the page just doesn't exist.</p>
      <a class="home" href="/">← Back home</a>
    </main>

    <footer>
      <span>Kaine Cohen — Microsoft 365 consultant</span>
      <span>cohenholmes.co.uk</span>
    </footer>
  </div>
</body>
</html>
