<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison: in April 2025 an AI tool had no identity of its own and a human triggered every action; an AI agent today has a real Microsoft Entra Agent ID and is governed by Conditional Access, access reviews and Purview controls.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F1E33"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#F7F4EF"/>

  <!-- Left panel -->
  <rect x="20" y="50" width="380" height="400" rx="14" fill="#FCFAF6" stroke="#E3DFD3"/>
  <text x="210" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#0F1E33">April 2025</text>

  <rect x="170" y="95" width="80" height="36" rx="8" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="210" y="118" text-anchor="middle" font-family="Georgia, sans-serif" font-size="13" fill="#0F1E33">You</text>

  <line x1="210" y1="131" x2="210" y2="151" stroke="#0F1E33" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="130" y="155" width="160" height="54" rx="10" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="210" y="178" text-anchor="middle" font-family="Georgia, sans-serif" font-size="13" font-weight="600" fill="#0F1E33">AI tool</text>
  <text x="210" y="195" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#4A4A5A">Word Editor / Copilot chat</text>

  <line x1="210" y1="209" x2="210" y2="231" stroke="#0F1E33" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="235" width="140" height="46" rx="10" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="210" y="255" text-anchor="middle" font-family="Georgia, sans-serif" font-size="13" font-weight="600" fill="#0F1E33">Output</text>
  <text x="210" y="270" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10" fill="#4A4A5A">email, summary, draft</text>

  <line x1="210" y1="281" x2="210" y2="303" stroke="#8A8FA0" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="110" y="307" width="200" height="115" rx="10" fill="none" stroke="#A8501C" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="210" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#A8501C">No identity</text>
  <text x="210" y="358" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#4A4A5A">nothing to observe,</text>
  <text x="210" y="374" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#4A4A5A">govern, or secure</text>
  <text x="210" y="398" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#4A4A5A">a human triggers every action</text>

  <!-- Right panel -->
  <rect x="500" y="50" width="380" height="400" rx="14" fill="#FCFAF6" stroke="#E3DFD3"/>
  <text x="690" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#0F1E33">Now</text>

  <rect x="650" y="95" width="80" height="36" rx="8" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="690" y="118" text-anchor="middle" font-family="Georgia, sans-serif" font-size="13" fill="#0F1E33">You</text>

  <line x1="690" y1="131" x2="690" y2="151" stroke="#0F1E33" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="705" y="145" text-anchor="start" font-family="Georgia, sans-serif" font-size="10" fill="#4A4A5A">builds / approves</text>

  <rect x="610" y="155" width="160" height="50" rx="10" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="690" y="178" text-anchor="middle" font-family="Georgia, sans-serif" font-size="13" font-weight="600" fill="#0F1E33">Agent</text>
  <text x="690" y="194" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#4A4A5A">built in Copilot Studio</text>

  <line x1="690" y1="205" x2="690" y2="222" stroke="#0F1E33" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="560" y="225" width="260" height="215" rx="12" fill="none" stroke="#0F1E33" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="576" y="244" text-anchor="start" font-family="Georgia, serif" font-size="12.5" font-weight="600" fill="#0F1E33">Microsoft Entra</text>

  <rect x="630" y="252" width="120" height="40" rx="8" fill="#F1E2D6" stroke="#C8622A"/>
  <text x="690" y="277" text-anchor="middle" font-family="Georgia, sans-serif" font-size="11.5" font-weight="600" fill="#A8501C">Agent ID</text>

  <line x1="690" y1="292" x2="690" y2="312" stroke="#0F1E33" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="580" y="316" width="220" height="26" rx="13" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="690" y="333" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#0F1E33">Conditional Access</text>

  <rect x="580" y="350" width="220" height="26" rx="13" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="690" y="367" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#0F1E33">Access reviews</text>

  <rect x="580" y="384" width="220" height="26" rx="13" fill="#F7F4EF" stroke="#E3DFD3"/>
  <text x="690" y="401" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10.5" fill="#0F1E33">Purview controls</text>

  <text x="690" y="425" text-anchor="middle" font-family="Georgia, sans-serif" font-size="10" fill="#4A4A5A">owned by a named person</text>
</svg>
