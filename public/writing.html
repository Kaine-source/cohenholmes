<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Kaine Cohen</title>
<meta name="description" content="Posts on identity, security and AI engineering by Kaine Cohen, pulled automatically from Medium.">
<link rel="canonical" href="https://cohenholmes.co.uk/writing">
<meta property="og:type" content="website">
<meta property="og:title" content="Writing — Kaine Cohen">
<meta property="og:description" content="Notes on identity, security and the move into AI engineering.">
<meta property="og:url" content="https://cohenholmes.co.uk/writing">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171C;
    --paper:#F3F1EC;
    --line:#D8D4C8;
    --signal:#3B5BFF;
    --muted:#6B6A63;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{ max-width:760px; margin:0 auto; padding:0 28px; }

  header{ padding:64px 0 8px; }
  .mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .back{
    display:inline-block;
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
  }
  .back:hover{ color:var(--signal); }

  h1{
    font-family:'Fraunces', serif;
    font-weight:480;
    font-size:clamp(32px, 5vw, 44px);
    line-height:1.1;
    letter-spacing:-0.01em;
    margin:22px 0 12px;
  }
  .lede{
    font-size:16px;
    color:var(--muted);
    max-width:56ch;
    margin-bottom:44px;
  }

  main{ padding-bottom:80px; }

  .state{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    color:var(--muted);
    padding:24px 0;
  }

  .posts{
    list-style:none;
    display:flex;
    flex-direction:column;
  }
  .post{
    border-top:1px solid var(--line);
    padding:26px 0;
    display:grid;
    grid-template-columns:96px 1fr;
    gap:20px;
    opacity:0;
    animation:rise 0.5s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .post:last-child{ border-bottom:1px solid var(--line); }
  .post .thumb{
    width:96px;
    height:96px;
    border-radius:8px;
    object-fit:cover;
    background:#E7E4DB;
  }
  .post .thumb.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }
  .post-body a.title-link{
    text-decoration:none;
    color:var(--ink);
  }
  .post-body h2{
    font-family:'Fraunces', serif;
    font-weight:480;
    font-size:20px;
    line-height:1.3;
    margin-bottom:6px;
  }
  .post-body a.title-link:hover h2{ color:var(--signal); }
  .post-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:8px;
    display:block;
  }
  .post-snippet{
    font-size:14.5px;
    color:#41444B;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  .divider{ height:1px; background:var(--line); margin:48px 0 32px; }

  .note{
    font-size:14.5px;
    color:var(--muted);
    max-width:56ch;
  }
  .note a{ color:var(--ink); }

  footer{
    padding:32px 0 48px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (max-width:480px){
    .post{ grid-template-columns:1fr; }
    .post .thumb{ width:100%; height:160px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mark">Kaine Cohen</div>
    <a class="back" href="/">← Home</a>
    <h1>Writing</h1>
    <p class="lede">Notes on identity, security and the move into AI engineering. Pulled automatically from Medium — nothing here is edited by hand.</p>
  </header>

  <main>
    <div id="state" class="state">Loading posts…</div>
    <ul id="posts" class="posts" aria-live="polite"></ul>
  </main>

  <div class="divider"></div>
  <p class="note">Prefer to read on Medium directly? <a href="https://medium.com/@kaine.cohen" target="_blank" rel="noopener">Follow there ↗</a></p>

  <footer>
    <span>© 2026 Kaine Cohen</span>
    <span>cohenholmes.co.uk</span>
  </footer>
</div>

<script>
  function safeHttpsUrl(value) {
    try {
      const url = new URL(value, window.location.origin);
      return url.protocol === 'https:' ? url.href : null;
    } catch (_) {
      return null;
    }
  }

  function makeTextElement(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text || '';
    return el;
  }

  async function loadPosts() {
    const stateEl = document.getElementById('state');
    const listEl = document.getElementById('posts');

    try {
      const res = await fetch('/api/medium-feed');
      if (!res.ok) throw new Error('Feed request failed: ' + res.status);
      const data = await res.json();

      if (!Array.isArray(data.posts) || data.posts.length === 0) {
        stateEl.textContent = 'No posts found yet.';
        return;
      }

      stateEl.remove();

      data.posts.forEach((post, i) => {
        const li = document.createElement('li');
        li.className = 'post';
        li.style.animationDelay = (i * 0.05) + 's';

        const thumbnailUrl = safeHttpsUrl(post.thumbnail);
        if (thumbnailUrl) {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = thumbnailUrl;
          img.alt = '';
          img.loading = 'lazy';
          li.appendChild(img);
        } else {
          const placeholder = makeTextElement('div', 'thumb placeholder', 'No image');
          li.appendChild(placeholder);
        }

        const body = document.createElement('div');
        body.className = 'post-body';

        const link = document.createElement('a');
        link.className = 'title-link';
        const articleUrl = safeHttpsUrl(post.link);
        link.href = articleUrl || 'https://medium.com/@kaine.cohen';
        link.target = '_blank';
        link.rel = 'noopener';

        const date = post.pubDate
          ? new Date(post.pubDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
          : '';

        link.appendChild(makeTextElement('span', 'post-date', date));
        link.appendChild(makeTextElement('h2', '', post.title));
        body.appendChild(link);
        body.appendChild(makeTextElement('p', 'post-snippet', post.snippet));
        li.appendChild(body);
        listEl.appendChild(li);
      });
    } catch (err) {
      stateEl.textContent = 'Could not load posts right now — try refreshing, or read on Medium directly.';
      console.error(err);
    }
  }

  loadPosts();
</script>

</body>
</html>
