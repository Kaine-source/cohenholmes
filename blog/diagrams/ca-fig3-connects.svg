<svg id="svg3" width="1180" height="820" viewBox="0 0 1180 820" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#14171C;}.display{font-family:Fraunces,Georgia,serif;}.mono{font-family:"IBM Plex Mono",Consolas,monospace;}.muted{fill:#6B6A63;}.card{fill:#F8F4EE;stroke:#D8D4C8;stroke-width:1.5;}.dim{fill:#E7E4DB;stroke:#D8D4C8;stroke-width:1.5;}.edge{stroke:#6B6A63;stroke-width:1.6;fill:none;}.flow{stroke:#14171C;stroke-width:1.8;fill:none;}.sig-box{fill:#F8F4EE;stroke:#3B5BFF;stroke-width:2.4;}.lbl{font-size:15px;font-weight:600;}.sublbl{font-size:13px;}.kicker{font-size:11px;font-weight:600;letter-spacing:1.5px;}.fig-title{font-size:30px;font-weight:600;}.fig-sub{font-size:16px;}</style>
  <rect x="0" y="0" width="1180" height="820" fill="#F3F1EC"/>

  <text class="display fig-title" x="45" y="52">What Conditional Access connects to</text>
  <text class="fig-sub muted" x="45" y="84">The baseline is the enforcement point the rest of the stack plugs into.</text>

  <g id="spokes"><line x1="385" y1="220" x2="590" y2="430" stroke="#6B6A63" stroke-width="1.5"/><circle cx="590" cy="430" r="4" fill="#6B6A63"/><line x1="795" y1="220" x2="590" y2="430" stroke="#6B6A63" stroke-width="1.5"/><circle cx="590" cy="430" r="4" fill="#6B6A63"/><line x1="345" y1="430" x2="590" y2="430" stroke="#6B6A63" stroke-width="1.5"/><circle cx="590" cy="430" r="4" fill="#6B6A63"/><line x1="835" y1="430" x2="590" y2="430" stroke="#6B6A63" stroke-width="1.5"/><circle cx="590" cy="430" r="4" fill="#6B6A63"/><line x1="385" y1="640" x2="590" y2="430" stroke="#6B6A63" stroke-width="1.5"/><circle cx="590" cy="430" r="4" fill="#6B6A63"/><line x1="795" y1="640" x2="590" y2="430" stroke="#6B6A63" stroke-width="1.5"/><circle cx="590" cy="430" r="4" fill="#6B6A63"/></g>

  <g id="sats"><rect x="105" y="180" width="280" height="80" rx="11" fill="#E7E4DB" stroke="#D8D4C8" stroke-width="1.5"/><text x="245" y="213" text-anchor="middle" font-size="14.5px" font-weight="600">Microsoft Intune</text><text x="245" y="237" text-anchor="middle" font-size="12px" class="muted">device compliance state</text><rect x="795" y="180" width="280" height="80" rx="11" fill="#E7E4DB" stroke="#D8D4C8" stroke-width="1.5"/><text x="935" y="213" text-anchor="middle" font-size="14.5px" font-weight="600">Defender for Cloud Apps</text><text x="935" y="237" text-anchor="middle" font-size="12px" class="muted">in-session control, block downloads</text><rect x="65" y="390" width="280" height="80" rx="11" fill="#E7E4DB" stroke="#D8D4C8" stroke-width="1.5"/><text x="205" y="423" text-anchor="middle" font-size="14.5px" font-weight="600">Entra ID Protection</text><text x="205" y="447" text-anchor="middle" font-size="12px" class="muted">sign-in risk, user risk</text><rect x="835" y="390" width="280" height="80" rx="11" fill="#E7E4DB" stroke="#D8D4C8" stroke-width="1.5"/><text x="975" y="423" text-anchor="middle" font-size="14.5px" font-weight="600">Privileged Identity Management</text><text x="975" y="447" text-anchor="middle" font-size="12px" class="muted">step-up on role activation</text><rect x="105" y="600" width="280" height="80" rx="11" fill="#E7E4DB" stroke="#D8D4C8" stroke-width="1.5"/><text x="245" y="633" text-anchor="middle" font-size="14.5px" font-weight="600">Microsoft Purview</text><text x="245" y="657" text-anchor="middle" font-size="12px" class="muted">insider-risk level, label auth context</text><rect x="795" y="600" width="280" height="80" rx="11" fill="#E7E4DB" stroke="#D8D4C8" stroke-width="1.5"/><text x="935" y="633" text-anchor="middle" font-size="14.5px" font-weight="600">Entra Suite (Global Secure Access)</text><text x="935" y="657" text-anchor="middle" font-size="12px" class="muted">network and app as conditions</text></g>

  <text class="fig-sub muted" x="45" y="798" style="font-size:15px">Each line is a signal Conditional Access reads, or a control it enforces through another service.</text>
<rect class="sig-box" x="450" y="382" width="280" height="96" rx="16"/><text class="lbl" x="590" y="426" text-anchor="middle" font-size="19px">Conditional Access</text><text class="sublbl muted" x="590" y="451" text-anchor="middle">the policy engine</text></svg>