<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg2" width="1180" height="1500" viewBox="0 0 1180 1500" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#14171C;}.display{font-family:Fraunces,Georgia,serif;}.mono{font-family:"IBM Plex Mono",Consolas,monospace;}.muted{fill:#6B6A63;}.card{fill:#F8F4EE;stroke:#D8D4C8;stroke-width:1.5;}.dim{fill:#E7E4DB;stroke:#D8D4C8;stroke-width:1.5;}.edge{stroke:#6B6A63;stroke-width:1.6;fill:none;}.flow{stroke:#14171C;stroke-width:1.8;fill:none;}.sig-box{fill:#F8F4EE;stroke:#3B5BFF;stroke-width:2.4;}.lbl{font-size:15px;font-weight:600;}.sublbl{font-size:13px;}.kicker{font-size:11px;font-weight:600;letter-spacing:1.5px;}.fig-title{font-size:30px;font-weight:600;}.fig-sub{font-size:16px;}</style>
  <rect x="0" y="0" width="1180" height="1500" fill="#F3F1EC"/>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B5BFF"/>
    </marker>
  </defs>

  <text class="display fig-title" x="45" y="52">The baseline, in order</text>
  <text class="fig-sub muted" x="45" y="84">Every layer goes in report-only, then a pilot group, then everyone.</text>

  <!-- break-glass bracket -->
  <path class="edge" d="M120,150 L104,150 L104,1360 L120,1360" stroke-width="1.5"/>
  <text class="sublbl muted" x="86" y="755" text-anchor="middle" transform="rotate(-90 86 755)">Break-glass accounts excluded from every layer</text>

  <!-- rollout rail -->
  <text class="mono kicker muted" x="1006" y="140">ROLLOUT</text>
  <line x1="1006" y1="158" x2="1006" y2="1360" class="edge" stroke="#3B5BFF" stroke-width="2" marker-end="url(#ah2)"/>
  <g id="railStops"><circle cx="1006" cy="212" r="6" fill="#3B5BFF"/><text x="988" y="217" text-anchor="end" font-size="14px" font-weight="600" fill="#14171C">report-only</text><circle cx="1006" cy="762" r="6" fill="#3B5BFF"/><text x="988" y="767" text-anchor="end" font-size="14px" font-weight="600" fill="#14171C">pilot group</text><circle cx="1006" cy="1310" r="6" fill="#3B5BFF"/><text x="988" y="1315" text-anchor="end" font-size="14px" font-weight="600" fill="#14171C">all users</text></g>

  <g id="cards"><g><rect x="150" y="132" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="191" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="199" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">1</text><text x="250" y="182" font-size="19px" font-weight="600">Block legacy authentication</text><text x="250" y="212" font-size="14px" fill="#6B6A63">Removes the bypass every layer below would otherwise have</text><rect x="758" y="172" width="96" height="32" rx="16" fill="#3B5BFF"/></g><text x="806" y="193" text-anchor="middle" font-size="13px" font-weight="600" style="fill:#ffffff">start here</text><g><rect x="150" y="270" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="329" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="337" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">2</text><text x="250" y="320" font-size="19px" font-weight="600">Phishing-resistant MFA for admins</text><text x="250" y="350" font-size="14px" fill="#6B6A63">Smallest group, highest value: passkeys / FIDO2, not push</text><rect x="730" y="310" width="124" height="32" rx="16" fill="none" stroke="#3B5BFF" stroke-width="1.6"/></g><text x="792" y="331" text-anchor="middle" font-size="12.5px" font-weight="600" style="fill:#3B5BFF">highest value</text><g><rect x="150" y="408" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="467" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="475" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">3</text><text x="250" y="458" font-size="19px" font-weight="600">Secure the MFA registration surface</text><text x="250" y="488" font-size="14px" fill="#6B6A63">Stop a phished password becoming a registered attacker method</text></g><g><rect x="150" y="546" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="605" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="613" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">4</text><text x="250" y="596" font-size="19px" font-weight="600">Require MFA for all users, all apps</text><text x="250" y="626" font-size="14px" fill="#6B6A63">The broad baseline; raise to phishing-resistant later</text></g><g><rect x="150" y="684" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="743" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="751" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">5</text><text x="250" y="734" font-size="19px" font-weight="600">Require a managed device</text><text x="250" y="764" font-size="14px" fill="#6B6A63">MFA proves who; compliance proves the endpoint</text></g><g><rect x="150" y="822" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="881" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="889" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">6</text><text x="250" y="872" font-size="19px" font-weight="600">Contain unmanaged devices</text><text x="250" y="902" font-size="14px" fill="#6B6A63">MFA + short sign-in frequency + no persistent browser</text></g><g><rect x="150" y="960" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="1019" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="1027" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">7</text><text x="250" y="1010" font-size="19px" font-weight="600">Risk-based policies</text><text x="250" y="1040" font-size="14px" fill="#6B6A63">Sign-in risk and user risk, needs Entra ID P2</text><rect x="804" y="1000" width="50" height="32" rx="16" fill="none" stroke="#3B5BFF" stroke-width="1.6"/></g><text x="829" y="1021" text-anchor="middle" font-size="13px" font-weight="600" style="fill:#3B5BFF">P2</text><g><rect x="150" y="1098" width="726" height="118" rx="12" fill="#F8F4EE" stroke="#D8D4C8" stroke-width="1.5"/><circle cx="202" cy="1157" r="23" fill="#3B5BFF" stroke="none" stroke-width="1.5"/><text x="202" y="1165" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#ffffff" class="mono">8</text><text x="250" y="1148" font-size="19px" font-weight="600">MFA for guests &amp; external users</text><text x="250" y="1178" font-size="14px" fill="#6B6A63">You can't assume their home tenant did any MFA</text></g><g><rect x="150" y="1236" width="726" height="118" rx="12" fill="#F3F1EC" stroke="#6B6A63" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="202" cy="1295" r="23" fill="#F3F1EC" stroke="#6B6A63" stroke-width="1.5" stroke-dasharray="5 4"/><text x="202" y="1303" text-anchor="middle" font-size="20px" font-weight="700" style="fill:#6B6A63" class="mono">+</text><text x="250" y="1286" font-size="19px" font-weight="600">Restrict device code flow</text><text x="250" y="1316" font-size="14px" fill="#6B6A63">Borderline core after the 2024–25 device-code phishing wave</text></g></g>

  <text class="fig-sub muted" x="45" y="1420" style="font-size:15px">Admins (2) before everyone (4): the smallest blast radius, and a small enough group</text>
  <text class="fig-sub muted" x="45" y="1444" style="font-size:15px">to walk through passkey registration by hand.</text>
</svg>