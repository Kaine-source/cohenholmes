<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171C; --paper:#F3F1EC; --card:#F8F4EE; --paper-dim:#E7E4DB;
    --line:#D8D4C8; --muted:#6B6A63; --signal:#3B5BFF;
  }
  body{ margin:0; background:var(--paper); }
  .sheet{ margin:0 0 40px; }
  svg{ display:block; }
  svg text{ font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif; fill:var(--ink); }
  .display{ font-family:'Fraunces',Georgia,serif; }
  .mono{ font-family:'IBM Plex Mono',Consolas,monospace; }
  .fig-title{ font-size:30px; font-weight:600; }
  .fig-sub{ font-size:16px; }
  .muted{ fill:var(--muted); }
  .card{ fill:var(--card); stroke:var(--line); stroke-width:1.5; }
  .dim{ fill:var(--paper-dim); stroke:var(--line); stroke-width:1.5; }
  .edge{ stroke:var(--muted); stroke-width:1.6; fill:none; }
  .flow{ stroke:var(--ink); stroke-width:1.8; fill:none; }
  .sig-box{ fill:var(--card); stroke:var(--signal); stroke-width:2.4; }
  .lbl{ font-size:15px; font-weight:600; }
  .sublbl{ font-size:13px; }
  .kicker{ font-size:11px; font-weight:600; letter-spacing:1.5px; }
</style>
</head>
<body>

<!-- ============ DIAGRAM 1 ============ -->
<div class="sheet">
<svg id="svg1" width="1500" height="520" viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1500" height="520" fill="var(--paper)"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text class="display fig-title" x="45" y="46">Where Conditional Access sits in a sign-in</text>

  <!-- A: sign-in attempt -->
  <rect class="card" x="45" y="175" width="170" height="120" rx="12"/>
  <text class="lbl" x="130" y="228" text-anchor="middle">Sign-in</text>
  <text class="lbl" x="130" y="250" text-anchor="middle">attempt</text>

  <line class="flow" x1="215" y1="235" x2="262" y2="235" marker-end="url(#ah)"/>

  <!-- B: first-factor check -->
  <rect class="card" x="270" y="175" width="215" height="120" rx="12"/>
  <text class="lbl" x="377" y="223" text-anchor="middle">First-factor check</text>
  <text class="mono sublbl muted" x="377" y="250" text-anchor="middle">password · passkey · federation</text>

  <line class="flow" x1="485" y1="235" x2="532" y2="235" marker-end="url(#ah)"/>

  <!-- C: CA evaluation -->
  <rect class="sig-box" x="540" y="128" width="430" height="264" rx="14"/>
  <text class="lbl" x="755" y="158" text-anchor="middle" style="font-size:17px">Conditional Access evaluation</text>

  <rect class="dim" x="562" y="176" width="386" height="90" rx="9"/>
  <text class="mono kicker muted" x="580" y="202">CONDITIONS</text>
  <text class="sublbl" x="580" y="228">user · device · location ·</text>
  <text class="sublbl" x="580" y="248">application · sign-in &amp; user risk</text>

  <rect class="dim" x="562" y="278" width="386" height="96" rx="9"/>
  <text class="mono kicker muted" x="580" y="304">CONTROLS</text>
  <text class="sublbl" x="580" y="330">allow · block · require MFA ·</text>
  <text class="sublbl" x="580" y="350">compliant device · limit session</text>

  <!-- pass path -->
  <line class="flow" x1="970" y1="235" x2="1017" y2="235" marker-end="url(#ah)"/>

  <!-- block offshoot -->
  <path class="edge" d="M755,392 L755,430 L648,430" marker-end="url(#ahm)"/>
  <text class="mono sublbl muted" x="770" y="416">block</text>
  <rect class="dim" x="470" y="408" width="175" height="44" rx="9"/>
  <text class="sublbl" x="557" y="435" text-anchor="middle" style="font-weight:600">Access denied</text>

  <!-- D: token -->
  <rect class="card" x="1025" y="175" width="170" height="120" rx="12"/>
  <text class="lbl" x="1110" y="228" text-anchor="middle">Token</text>
  <text class="lbl" x="1110" y="250" text-anchor="middle">issued</text>

  <line class="flow" x1="1197" y1="235" x2="1240" y2="235" marker-end="url(#ah)"/>

  <!-- E: app -->
  <rect class="card" x="1245" y="175" width="240" height="120" rx="12"/>
  <text class="lbl" x="1365" y="223" text-anchor="middle">Application</text>
  <text class="mono muted" x="1365" y="250" text-anchor="middle" style="font-size:12px">Exchange · SharePoint · SaaS</text>

  <text class="display" x="45" y="497" style="font-size:17px; font-style:italic; fill:var(--muted)">Conditional Access runs after the first factor and before the token is issued. Nothing reaches the app until it passes.</text>
</svg>
</div>

<!-- ============ DIAGRAM 2 ============ -->
<div class="sheet">
<svg id="svg2" width="1180" height="1500" viewBox="0 0 1180 1500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="1500" fill="var(--paper)"/>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--signal)"/>
    </marker>
  </defs>

  <text class="display fig-title" x="45" y="52">The baseline, in order</text>
  <text class="fig-sub muted" x="45" y="84">Every layer goes in report-only, then a pilot group, then everyone.</text>

  <!-- break-glass bracket -->
  <path class="edge" d="M120,150 L104,150 L104,1360 L120,1360" stroke-width="1.5"/>
  <text class="sublbl muted" x="86" y="755" text-anchor="middle" transform="rotate(-90 86 755)">Break-glass accounts excluded from every layer</text>

  <!-- rollout rail -->
  <text class="mono kicker muted" x="1006" y="140">ROLLOUT</text>
  <line x1="1006" y1="158" x2="1006" y2="1360" class="edge" stroke="var(--signal)" stroke-width="2" marker-end="url(#ah2)"/>
  <g id="railStops"></g>

  <g id="cards"></g>

  <text class="fig-sub muted" x="45" y="1420" style="font-size:15px">Admins (2) before everyone (4): the smallest blast radius, and a small enough group</text>
  <text class="fig-sub muted" x="45" y="1444" style="font-size:15px">to walk through passkey registration by hand.</text>
</svg>
</div>

<!-- ============ DIAGRAM 3 ============ -->
<div class="sheet">
<svg id="svg3" width="1180" height="820" viewBox="0 0 1180 820" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="820" fill="var(--paper)"/>

  <text class="display fig-title" x="45" y="52">What Conditional Access connects to</text>
  <text class="fig-sub muted" x="45" y="84">The baseline is the enforcement point the rest of the stack plugs into.</text>

  <g id="spokes"></g>

  <g id="sats"></g>

  <text class="fig-sub muted" x="45" y="798" style="font-size:15px">Each line is a signal Conditional Access reads, or a control it enforces through another service.</text>
</svg>
</div>

<script>
var SVGNS = "http://www.w3.org/2000/svg";
function el(name, attrs, text){
  var n = document.createElementNS(SVGNS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

/* ---- Diagram 2: layer cards ---- */
var LAYERS = [
  ["1","Block legacy authentication","Explicit and auditable — covers the apps you don't gate with MFA"],
  ["2","Phishing-resistant MFA for admins","Smallest group, highest value: passkeys / FIDO2, not push"],
  ["3","Secure the MFA registration surface","Stop a phished password becoming a registered attacker method"],
  ["4","Require MFA for all users, all apps","The broad baseline; raise to phishing-resistant later"],
  ["5","Require a managed device","MFA proves who; compliance proves the endpoint"],
  ["6","Contain unmanaged devices","MFA + short sign-in frequency + no persistent browser"],
  ["7","Risk-based policies","Sign-in risk and user risk, needs Entra ID P2"],
  ["8","MFA for guests & external users","You can't assume their home tenant did any MFA"],
  ["9","Restrict device code flow","Now in Security Defaults and the Microsoft-managed policies"]
];

var cards = document.getElementById("cards");
var y0 = 132, pitch = 138, cw = 726, cx = 150;
function drawCard(i, row, dashed){
  var y = y0 + i*pitch;
  var g = el("g", {});
  var rect = el("rect", { x:cx, y:y, width:cw, height:118, rx:12,
    fill: dashed ? "var(--paper)" : "var(--card)",
    stroke: dashed ? "var(--muted)" : "var(--line)",
    "stroke-width": 1.5 });
  if (dashed) rect.setAttribute("stroke-dasharray", "7 6");
  g.appendChild(rect);
  var chipFill = dashed ? "var(--paper)" : "var(--signal)";
  var chip = el("circle", { cx:cx+52, cy:y+59, r:23, fill:chipFill,
    stroke: dashed ? "var(--muted)" : "none", "stroke-width":1.5 });
  if (dashed) chip.setAttribute("stroke-dasharray", "5 4");
  g.appendChild(chip);
  g.appendChild(el("text", { x:cx+52, y:y+67, "text-anchor":"middle",
    "font-size":"20px", "font-weight":"700",
    style: "fill:" + (dashed ? "#6B6A63" : "#ffffff"), class:"mono" }, row[0]));
  g.appendChild(el("text", { x:cx+100, y:y+50, "font-size":"19px", "font-weight":"600" }, row[1]));
  g.appendChild(el("text", { x:cx+100, y:y+80, "font-size":"14px", fill:"var(--muted)" }, row[2]));
  cards.appendChild(g);

  if (row[0] === "1"){
    g.appendChild(el("rect", { x:cx+cw-118, y:y+40, width:96, height:32, rx:16, fill:"var(--signal)" }));
    cards.appendChild(el("text", { x:cx+cw-70, y:y+61, "text-anchor":"middle", "font-size":"13px", "font-weight":"600", style:"fill:#ffffff" }, "start here"));
  }
  if (row[0] === "2"){
    g.appendChild(el("rect", { x:cx+cw-146, y:y+40, width:124, height:32, rx:16, fill:"none", stroke:"var(--signal)", "stroke-width":1.6 }));
    cards.appendChild(el("text", { x:cx+cw-84, y:y+61, "text-anchor":"middle", "font-size":"12.5px", "font-weight":"600", style:"fill:#3B5BFF" }, "highest value"));
  }
  if (row[0] === "7"){
    g.appendChild(el("rect", { x:cx+cw-72, y:y+40, width:50, height:32, rx:16, fill:"none", stroke:"var(--signal)", "stroke-width":1.6 }));
    cards.appendChild(el("text", { x:cx+cw-47, y:y+61, "text-anchor":"middle", "font-size":"13px", "font-weight":"600", style:"fill:#3B5BFF" }, "P2"));
  }
}
LAYERS.forEach(function(r,i){ drawCard(i, r, false); });

/* rollout rail stops */
var rail = document.getElementById("railStops");
[["report-only",212],["pilot group",762],["all users",1310]].forEach(function(s){
  rail.appendChild(el("circle", { cx:1006, cy:s[1], r:6, fill:"var(--signal)" }));
  rail.appendChild(el("text", { x:988, y:s[1]+5, "text-anchor":"end", "font-size":"14px", "font-weight":"600", fill:"var(--ink)" }, s[0]));
});

/* ---- Diagram 3: hub and spokes ---- */
var CENTER = { x:590, y:430 };
var SATS = [
  ["Microsoft Intune","device compliance state", 245, 220],
  ["Defender for Cloud Apps","in-session control, block downloads", 935, 220],
  ["Entra ID Protection","sign-in risk, user risk", 205, 430],
  ["Privileged Identity Management","step-up on role activation", 975, 430],
  ["Microsoft Purview","insider-risk level, label auth context", 245, 640],
  ["Entra Suite (Global Secure Access)","network and app as conditions", 935, 640]
];
var spokes = document.getElementById("spokes");
var sats = document.getElementById("sats");
var sw = 280, sh = 80;
SATS.forEach(function(s){
  var bx = s[2], by = s[3];
  var left = bx < CENTER.x;
  // connector from box edge toward centre edge
  var startX = left ? bx + sw/2 : bx - sw/2;
  var startY = by;
  spokes.appendChild(el("line", { x1:startX, y1:startY, x2:CENTER.x, y2:CENTER.y,
    stroke:"var(--muted)", "stroke-width":1.5 }));
  spokes.appendChild(el("circle", { cx:CENTER.x, cy:CENTER.y, r:4, fill:"var(--muted)" }));
  sats.appendChild(el("rect", { x:bx - sw/2, y:by - sh/2, width:sw, height:sh, rx:11,
    fill:"var(--paper-dim)", stroke:"var(--line)", "stroke-width":1.5 }));
  sats.appendChild(el("text", { x:bx, y:by - 7, "text-anchor":"middle", "font-size":"14.5px", "font-weight":"600" }, s[0]));
  sats.appendChild(el("text", { x:bx, y:by + 17, "text-anchor":"middle", "font-size":"12px", class:"muted" }, s[1]));
});
// redraw centre box on top of spokes
var c = document.getElementById("svg3");
c.appendChild(el("rect", { class:"sig-box", x:450, y:382, width:280, height:96, rx:16 }));
c.appendChild(el("text", { class:"lbl", x:590, y:426, "text-anchor":"middle", "font-size":"19px" }, "Conditional Access"));
c.appendChild(el("text", { class:"sublbl muted", x:590, y:451, "text-anchor":"middle" }, "the policy engine"));

/* ---- PNG export ---- */
async function exportPNG(id, scale){
  scale = scale || 2;
  var svg = document.getElementById(id);
  var w = +svg.getAttribute("width"), h = +svg.getAttribute("height");
  var clone = svg.cloneNode(true);
  // inline computed CSS var colours
  var cs = getComputedStyle(document.documentElement);
  var map = {
    "var(--ink)": cs.getPropertyValue("--ink").trim(),
    "var(--paper)": cs.getPropertyValue("--paper").trim(),
    "var(--card)": cs.getPropertyValue("--card").trim(),
    "var(--paper-dim)": cs.getPropertyValue("--paper-dim").trim(),
    "var(--line)": cs.getPropertyValue("--line").trim(),
    "var(--muted)": cs.getPropertyValue("--muted").trim(),
    "var(--signal)": cs.getPropertyValue("--signal").trim()
  };
  var xml = new XMLSerializer().serializeToString(clone);
  Object.keys(map).forEach(function(k){
    xml = xml.split(k).join(map[k]);
  });
  var I = map["var(--ink)"], M = map["var(--muted)"], L = map["var(--line)"],
      C = map["var(--card)"], D = map["var(--paper-dim)"], S = map["var(--signal)"];
  var style = '<style>' +
    'text{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;fill:' + I + ';}' +
    '.display{font-family:Fraunces,Georgia,serif;}' +
    '.mono{font-family:"IBM Plex Mono",Consolas,monospace;}' +
    '.muted{fill:' + M + ';}' +
    '.card{fill:' + C + ';stroke:' + L + ';stroke-width:1.5;}' +
    '.dim{fill:' + D + ';stroke:' + L + ';stroke-width:1.5;}' +
    '.edge{stroke:' + M + ';stroke-width:1.6;fill:none;}' +
    '.flow{stroke:' + I + ';stroke-width:1.8;fill:none;}' +
    '.sig-box{fill:' + C + ';stroke:' + S + ';stroke-width:2.4;}' +
    '.lbl{font-size:15px;font-weight:600;}' +
    '.sublbl{font-size:13px;}' +
    '.kicker{font-size:11px;font-weight:600;letter-spacing:1.5px;}' +
    '.fig-title{font-size:30px;font-weight:600;}' +
    '.fig-sub{font-size:16px;}' +
    '</style>';
  xml = xml.replace(/<svg([^>]*)>/, '<svg$1>' + style);
  var blob = new Blob([xml], { type:"image/svg+xml;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var img = new Image();
  await new Promise(function(res, rej){ img.onload = res; img.onerror = rej; img.src = url; });
  var canvas = document.createElement("canvas");
  canvas.width = w*scale; canvas.height = h*scale;
  var ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.drawImage(img, 0, 0);
  URL.revokeObjectURL(url);
  return canvas.toDataURL("image/png");
}
window.exportPNG = exportPNG;
document.fonts.ready.then(function(){ document.body.setAttribute("data-fonts","ready"); });
</script>
</body>
</html>
