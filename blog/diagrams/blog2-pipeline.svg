<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg4" width="1500" height="520" viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#14171C;}.display{font-family:Fraunces,Georgia,serif;}.mono{font-family:"IBM Plex Mono",Consolas,monospace;}.muted{fill:#6B6A63;}.card{fill:#F8F4EE;stroke:#D8D4C8;stroke-width:1.5;}.dim{fill:#E7E4DB;stroke:#D8D4C8;stroke-width:1.5;}.edge{stroke:#6B6A63;stroke-width:1.6;fill:none;}.flow{stroke:#14171C;stroke-width:1.8;fill:none;}.sig-box{fill:#F8F4EE;stroke:#3B5BFF;stroke-width:2.4;}.lbl{font-size:15px;font-weight:600;}.sublbl{font-size:13px;}.kicker{font-size:11px;font-weight:600;letter-spacing:1.5px;}.fig-title{font-size:30px;font-weight:600;}.fig-sub{font-size:16px;}</style>
  <rect x="0" y="0" width="1500" height="520" fill="#F3F1EC"/>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14171C"/>
    </marker>
    <marker id="ahm4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6A63"/>
    </marker>
  </defs>

  <text class="display fig-title" x="45" y="46">How a change reaches the site</text>

  <rect class="card" x="45" y="175" width="240" height="120" rx="12"/>
  <text class="lbl" x="165" y="228" text-anchor="middle">Local edit</text>
  <text class="mono sublbl muted" x="165" y="250" text-anchor="middle">agent, in the repo</text>

  <line class="flow" x1="285" y1="235" x2="330" y2="235" marker-end="url(#ah4)"/>

  <rect class="card" x="332" y="175" width="240" height="120" rx="12"/>
  <text class="lbl" x="452" y="228" text-anchor="middle">Branch + PR</text>
  <text class="mono sublbl muted" x="452" y="250" text-anchor="middle">validate + preview run</text>

  <line class="flow" x1="572" y1="235" x2="617" y2="235" marker-end="url(#ah4)"/>

  <rect class="sig-box" x="619" y="158" width="240" height="154" rx="14"/>
  <text class="lbl" x="739" y="222" text-anchor="middle" style="font-size:17px">Review</text>
  <text class="mono sublbl muted" x="739" y="246" text-anchor="middle">Copilot + me</text>
  <text class="mono sublbl" x="739" y="286" text-anchor="middle" style="fill:#3B5BFF; font-weight:600">approve</text>

  <line class="flow" x1="859" y1="235" x2="904" y2="235" marker-end="url(#ah4)"/>

  <rect class="card" x="906" y="175" width="240" height="120" rx="12"/>
  <text class="lbl" x="1026" y="228" text-anchor="middle">Merge to main</text>
  <text class="mono sublbl muted" x="1026" y="250" text-anchor="middle">branch protected</text>

  <line class="flow" x1="1146" y1="235" x2="1191" y2="235" marker-end="url(#ah4)"/>

  <rect class="card" x="1193" y="175" width="240" height="120" rx="12"/>
  <text class="lbl" x="1313" y="228" text-anchor="middle">Production</text>
  <text class="mono sublbl muted" x="1313" y="250" text-anchor="middle">auto-deploys on merge</text>

  <path class="edge" d="M1313,295 L1313,340 L1313,362" marker-end="url(#ahm4)"/>
  <rect class="dim" x="1178" y="366" width="270" height="46" rx="9"/>
  <text class="sublbl" x="1313" y="394" text-anchor="middle" style="font-weight:600">Failed deploy &#8594; I get pinged</text>

  <text class="display" x="45" y="497" style="font-size:17px; font-style:italic; fill:#6B6A63">Every change is a pull request. Nothing merges without a green check and the review step; nothing deploys except a merge to main.</text>
</svg>
